<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sirajan Munira — animated draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0906;
    --panel: rgba(28, 19, 12, 0.78);
    --panel-line: rgba(212, 170, 78, 0.22);
    --ink: #efe0c2;
    --ink-dim: #a8936d;
    --accent: #d4aa4e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0705; overflow: hidden; }
  body {
    display: grid; place-items: center;
    font: 13px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
  }

  /* ---------- Stage: 1600 × 1000 scene units (16:10), always fully visible ---------- */
  .stage {
    position: relative; overflow: hidden;
    width: min(100vw, 160vh); aspect-ratio: 16 / 10;
  }
  .abs { position: absolute; }
  .fill { position: absolute; inset: 0; }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* Scene boxes in % of the 1600 × 1000 stage */
  #lampBox  { left: 69.375%; top: 21%; width: 26.3125%; height: 56%; }      /* 1110,210  421×560 */
  #bookBox  { left: 12.5%;   top: 20%; width: 56.31%;   height: 56%; }      /* 200,200  901×560, tilted back in JS */
   /* selection toolbar: 3 small icons sitting just above the highlighted line (book units: 234 × 70) */
  #toolbar  { width: 19.48%; height: 10.65%; transform: translate(-50%, -100%);
              display: flex; justify-content: space-between; pointer-events: none; }
  .icon     { width: 29.9%; height: 100%; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  .face, .half, #cover { backface-visibility: hidden; }

  /* ---------- Minimal demo controls ---------- */
  .controls {
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    padding: 8px 14px 8px 8px;
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0.5; transition: opacity .3s ease;
  }
  .controls:hover, .controls:focus-within { opacity: 1; }
  .controls button {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: transparent; color: var(--ink); border: 1px solid var(--panel-line);
  }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }
  .controls button svg { width: 14px; height: 14px; fill: currentColor; }
  .controls label { display: flex; align-items: center; gap: 8px; color: var(--ink-dim); white-space: nowrap; }
  .controls output { min-width: 3.2em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .controls input[type=range] { width: 92px; accent-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 560px) {
    .controls { gap: 8px; padding-right: 10px; }
    .controls input[type=range] { width: 64px; }
    .controls output { display: none; }
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* =====================================================================
   CONFIG — tweak timing and look here
   ===================================================================== */
const CONFIG = {
  coverHold:   2.4,   // seconds the closed cover is shown
  openTime:    1.8,   // cover swing + left half landing
  turnTime:    2.0,   // one full page turn (lift + land)
  highlight:   0.8,   // highlighter sweep
  iconsHold:   2.2,   // how long the icon toolbar stays above the highlight
  tilt:        26,    // reading angle: degrees the book leans back
  spreads:     3,     // spreads shown per loop (page turns = spreads - 1)
  lampLevel:   100,   // default lamp intensity in %
  textColor:  '#847157',
  // which line gets highlighted on each spread: side 'L' or 'R', row 0..11
  highlights: [ { side: 'R', row: 2 }, { side: 'L', row: 7 }, { side: 'R', row: 9 } ]
};

/* Text-line geometry taken from the uploaded open-book SVG (viewBox units) */
const ROWS_Y = [173, 204, 235, 267, 298, 329, 412, 444, 475, 506, 538, 569];
const PAGE_X = { L: 310, R: 845 };
const FULL = 383, BAR_H = 14;

/* =====================================================================
   Page text: spread 0 reproduces the original lines exactly,
   later spreads get different (seeded, so every loop is identical) layouts
   ===================================================================== */
function seeded(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function pageLines(spread, side) {
  if (spread === 0) {
    const w = [1, 1, 1, 1, 0.86, 0.39];
    return ROWS_Y.map((y, i) => ({ y, w: FULL * w[i % 6] }));
  }
  const rnd = seeded(spread * 97 + (side === 'L' ? 13 : 71));
  const out = [];
  [[0, 6], [6, 12]].forEach(([a, b]) => {
    const n = 4 + Math.floor(rnd() * 3);            // 4–6 lines in this paragraph
    for (let i = 0; i < n; i++) {
      const last = i === n - 1, pen = i === n - 2;
      const w = last ? 0.22 + rnd() * 0.4 : pen && rnd() > 0.5 ? 0.8 + rnd() * 0.12 : 1;
      out.push({ y: ROWS_Y[a + i], w: FULL * w });
    }
  });
  return out;
}
const NS = 'http://www.w3.org/2000/svg';
function writeText(groupId, spread, side) {
  const g = document.getElementById(groupId);
  g.textContent = '';
  for (const l of pageLines(spread, side)) {
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', PAGE_X[side]); r.setAttribute('y', l.y);
    r.setAttribute('width', l.w.toFixed(1)); r.setAttribute('height', BAR_H);
    r.setAttribute('rx', 7); r.setAttribute('fill', CONFIG.textColor);
    g.appendChild(r);
  }
}
function lineWidth(spread, side, row) {
  const l = pageLines(spread, side).find(l => l.y === ROWS_Y[row]);
  return l ? l.w : FULL * 0.6;
}

/* =====================================================================
   Setup
   ===================================================================== */
const $ = id => document.getElementById(id);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = $('stage'), bookBox = $('bookBox');
const cover = $('cover'), leftHalf = $('leftHalf'), rightHalf = $('rightHalf');
const front = $('turnFront'), back = $('turnBack'), shR = $('shadowR'), shL = $('shadowL');
const hl = $('hl'), icons = ['icon0', 'icon1', 'icon2'].map($);

// 3D hinge = the spine at the centre of the book box
gsap.set([cover, leftHalf, rightHalf, front, back], { transformOrigin: '50% 50%' });
gsap.set(icons, { transformOrigin: '50% 100%' });
// Reading angle: the whole book leans back around its bottom edge.
// Page flips get their own perspective inside it (#bookShift), then the result is tilted.
function fitPerspective() {
  $('bookShift').style.perspective = (bookBox.clientWidth * 2.6) + 'px';
  gsap.set(bookBox, { transformOrigin: '50% 100%', transformPerspective: stage.clientWidth * 1.3, rotationX: CONFIG.tilt });
}
fitPerspective();
window.addEventListener('resize', fitPerspective);

// Dust motes in the lamp light
const motes = [];
if (!reduceMotion) {
  for (let i = 0; i < 14; i++) {
    const c = document.createElementNS(NS, 'circle');
    // scatter inside the lamp's light cone (shade at the top right, widening down to the left)
    const y = 360 + Math.random() * 360, k = (y - 320) / 450;
    const left = 1136 + (560 - 1136) * k, right = 1505 + (1580 - 1505) * k;
    c.setAttribute('cx', (left + 30 + Math.random() * (right - left - 60)).toFixed(1));
    c.setAttribute('cy', y.toFixed(1));
    c.setAttribute('r', (1.2 + Math.random() * 2).toFixed(1));
    $('motes').appendChild(c); motes.push(c);
  }
}

/* ---- Lamp light state: level = user slider, on = power (0..1), breath = flicker ---- */
const lamp = { level: CONFIG.lampLevel / 100, on: 0, breath: 1 };
function applyLight() {
  const k = lamp.on * lamp.level * lamp.breath;          // 0 … 1.5
  const vis = Math.min(1, k);
  $('lampLight').setAttribute('opacity', Math.min(1, k * 0.95).toFixed(3));
  $('pool').setAttribute('opacity', Math.min(1, k).toFixed(3));
  $('dimmer').setAttribute('opacity', ((1 - vis) * 0.62).toFixed(3));
  $('cone').setAttribute('opacity', Math.min(1, 0.75 + Math.max(0, k - 1) * 0.8).toFixed(3));
}

/* =====================================================================
   MASTER TIMELINE (intro once, then an endless book loop + ambient loops)
   ===================================================================== */
const master = gsap.timeline();

/* ---- A. Intro: pull the chain, lamp flickers on ---- */
function buildIntro() {
  const tl = gsap.timeline();
  tl.set(lamp, { on: 0, onComplete: applyLight }, 0)
    .to('#chain', { y: 26, duration: 0.18, ease: 'power2.in' }, 0.3)
    .to('#chain', { y: 0, duration: 0.5, ease: 'elastic.out(1, 0.4)' }, 0.48)
    .to(lamp, { keyframes: [
        { on: 0.7, duration: 0.06 }, { on: 0.1, duration: 0.08 },
        { on: 0.85, duration: 0.07 }, { on: 0.4, duration: 0.1 },
        { on: 1, duration: 0.5, ease: 'sine.out' } ],
      onUpdate: applyLight }, 0.5);
  return tl;
}

/* ---- B. Ambient: lamp breathing + floating dust (yoyo, never drifts) ---- */
function buildAmbient() {
  const tl = gsap.timeline();
  tl.add(gsap.to(lamp, { breath: 0.93, duration: 2.6, repeat: -1, yoyo: true, ease: 'sine.inOut', onUpdate: applyLight }), 0);
  motes.forEach((m, i) => {
    tl.add(gsap.fromTo(m,
      { x: -12, y: 10, opacity: 0.05 },
      { x: 14, y: -24, opacity: 0.55, duration: gsap.utils.random(3.5, 6.5),
        repeat: -1, yoyo: true, ease: 'sine.inOut' }), i * 0.3);
  });
  return tl;
}

/* ---- Small reusable pieces ---- */
// book viewBox (169 75 1201 657) → % of the book box, used to pin the toolbar to the highlight
const pctX = x => ((x - 169) / 1201 * 100).toFixed(3) + '%';
const pctY = y => ((y - 75) / 657 * 100).toFixed(3) + '%';
function highlightIn(tl, spread, at) {
  const h = CONFIG.highlights[spread % CONFIG.highlights.length];
  const w = lineWidth(spread, h.side, h.row);
  tl.set('#toolbar', { left: pctX(PAGE_X[h.side] + w / 2), top: pctY(ROWS_Y[h.row] - 14) }, at)
    .set(hl, { attr: { x: PAGE_X[h.side] - 8, y: ROWS_Y[h.row] - 8, width: 0 }, opacity: 0.55 }, at)
    .to(hl, { attr: { width: w + 16 }, duration: CONFIG.highlight, ease: 'power1.inOut' }, at);
}
function iconsUpDown(tl, at) {
  // pop up out of the highlighted line, like a text-selection toolbar
  tl.fromTo(icons, { yPercent: 70, opacity: 0, scale: 0.3 },
                   { yPercent: 0, opacity: 1, scale: 1, duration: 0.45, stagger: 0.09, ease: 'back.out(2.2)' }, at)
    .to(icons, { scale: 1.14, duration: 0.16, stagger: 0.22, yoyo: true, repeat: 1, ease: 'sine.inOut' }, at + 0.8)
    .to(icons, { yPercent: 40, opacity: 0, scale: 0.5, duration: 0.3, stagger: 0.05, ease: 'power2.in' },
        at + 0.5 + CONFIG.iconsHold);
  return at + 0.9 + CONFIG.iconsHold;
}
function pageTurn(tl, s, at) {
  const half = CONFIG.turnTime / 2;
  tl.call(() => {                                         // prepare faces + reveal next right page
      writeText('textFront', s, 'R'); writeText('textBack', s + 1, 'L'); writeText('textR', s + 1, 'R');
    }, null, at)
    .set(front, { autoAlpha: 1, rotationY: 0, filter: 'brightness(1)' }, at)
    .set(back,  { autoAlpha: 1, rotationY: 90, filter: 'brightness(0.8)' }, at)
    .to(hl, { opacity: 0, duration: 0.2 }, at - 0.25)
    .to(front, { rotationY: -90, duration: half, ease: 'power2.in' }, at)
    .to(front, { filter: 'brightness(0.8)', duration: half, ease: 'power1.in' }, at)
    .to(shR, { opacity: 1, duration: half * 0.85, ease: 'sine.out' }, at)
    .to(shR, { opacity: 0, duration: half * 0.6, ease: 'sine.in' }, at + half)
    .fromTo(shL, { opacity: 1 }, { opacity: 0, duration: half, ease: 'power1.out' }, at + half)
    .to(back, { rotationY: 0, filter: 'brightness(1)', duration: half, ease: 'power2.out' }, at + half)
    .call(() => writeText('textL', s + 1, 'L'), null, at + CONFIG.turnTime)
    .set([front, back], { autoAlpha: 0 }, at + CONFIG.turnTime);
  return at + CONFIG.turnTime;
}

/* ---- C. The book loop: cover → open → (highlight + icons → page turn) × n → close ---- */
function buildBookLoop() {
  const C = CONFIG, half = C.openTime / 2;
  const tl = gsap.timeline({ repeat: -1 });

  // closed state (also resets everything at the start of every loop)
  tl.call(() => { writeText('textL', 0, 'L'); writeText('textR', 0, 'R'); }, null, 0)
    .set('#bookShift', { xPercent: -25 }, 0)
    .set(cover, { autoAlpha: 1, rotationY: 0 }, 0)
    .set(leftHalf, { autoAlpha: 0, rotationY: 90 }, 0)
    .set(rightHalf, { autoAlpha: 0 }, 0)
    .set([front, back], { autoAlpha: 0 }, 0)
    .set([shR, shL], { opacity: 0 }, 0)
    .set(hl, { opacity: 0 }, 0)
    .set(icons, { yPercent: 70, opacity: 0, scale: 0.3 }, 0)
    .set('#shadowOpen', { attr: { rx: 330, cx: 1070 } }, 0)
    .fromTo('#glint', { x: 0 }, { x: 560, duration: 1.1, ease: 'power1.inOut' }, 0.6);

  // open the cover: book glides to centre, cover swings left, left half lands
  let t = C.coverHold;
  tl.set(rightHalf, { autoAlpha: 1 }, t)
    .to('#bookShift', { xPercent: 0, duration: C.openTime, ease: 'power2.inOut' }, t)
    .to('#shadowOpen', { attr: { rx: 660, cx: 769 }, duration: C.openTime, ease: 'power2.inOut' }, t)
    .to(cover, { rotationY: -90, duration: half, ease: 'power2.in' }, t)
    .to(shR, { opacity: 0.8, duration: half, ease: 'sine.out' }, t)
    .set(cover, { autoAlpha: 0 }, t + half)
    .set(leftHalf, { autoAlpha: 1 }, t + half)
    .to(leftHalf, { rotationY: 0, duration: half, ease: 'power2.out' }, t + half)
    .to(shR, { opacity: 0, duration: half * 0.7 }, t + half)
    .fromTo(shL, { opacity: 0.8 }, { opacity: 0, duration: half, ease: 'power1.out' }, t + half);
  t += C.openTime + 0.4;

  // spreads
  for (let s = 0; s < C.spreads; s++) {
    highlightIn(tl, s, t);
    t = iconsUpDown(tl, t + C.highlight + 0.2) + 0.3;
    if (s < C.spreads - 1) t = pageTurn(tl, s, t) + 0.5;
  }

  // close the book: left half lifts over, cover lands, book glides back
  tl.to(hl, { opacity: 0, duration: 0.3 }, t - 0.2)
    .to(leftHalf, { rotationY: 90, duration: half, ease: 'power2.in' }, t)
    .to(shR, { opacity: 0.8, duration: half, ease: 'sine.in' }, t)
    .set(leftHalf, { autoAlpha: 0 }, t + half)
    .set(cover, { autoAlpha: 1, rotationY: -90 }, t + half)
    .to(cover, { rotationY: 0, duration: half, ease: 'power2.out' }, t + half)
    .to(shR, { opacity: 0, duration: half * 0.6 }, t + half)
    .set(rightHalf, { autoAlpha: 0 }, t + C.openTime)
    .to('#bookShift', { xPercent: -25, duration: C.openTime, ease: 'power2.inOut' }, t)
    .to('#shadowOpen', { attr: { rx: 330, cx: 1070 }, duration: C.openTime, ease: 'power2.inOut' }, t)
    .to({}, { duration: 0.8 });                            // short rest before the loop restarts
  return tl;
}

applyLight();
master.add(buildIntro(), 0);
master.add(buildAmbient(), 1.4);
master.add(buildBookLoop(), 0);

/* =====================================================================
   Controls
   ===================================================================== */
const btnPlay = $('btnPlay'), speed = $('speed'), intensity = $('intensity');
function setPausedUI(p) {
  $('icoPause').hidden = p; $('icoPlay').hidden = !p;
  btnPlay.setAttribute('aria-label', p ? 'Play' : 'Pause');
  btnPlay.setAttribute('aria-pressed', String(p));
}
btnPlay.addEventListener('click', () => { master.paused(!master.paused()); setPausedUI(master.paused()); });
$('btnRestart').addEventListener('click', () => { master.restart(); setPausedUI(false); });
speed.addEventListener('input', () => {
  const v = +speed.value; master.timeScale(v); $('speedOut').textContent = v.toFixed(2) + '×';
});
intensity.addEventListener('input', () => {
  lamp.level = +intensity.value / 100; applyLight(); $('intOut').textContent = intensity.value + '%';
});
if (reduceMotion) { speed.value = 0.6; speed.dispatchEvent(new Event('input')); }
</script>
</body>
